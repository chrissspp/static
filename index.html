<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STATIC-9A3 // HYPER-ARCADE</title>
  <style>
    :root {
      --bg: #030308;
      --card: rgba(18, 18, 28, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #ff0055;
      --secondary: #00f0ff;
      --accent: #ffe600;
      --success: #00ff66;
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: var(--font);
      color: var(--text);
    }

    /* Animated Flowing Rainbow Background */
    .rainbow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.3), rgba(0, 240, 255, 0.2), rgba(0, 0, 0, 0.95));
      background-size: 200% 200%;
      animation: ambientGradient 8s ease infinite;
      z-index: 1;
      transition: opacity 0.3s;
    }

    @keyframes ambientGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Flowing Rainbow Screen Borders */
    .rainbow-border-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      border: 3px solid transparent;
      border-image: linear-gradient(90deg, #ff0055, #ffaa00, #00ff66, #00f0ff, #7000ff, #ff0055) 1;
      animation: borderFlow 4s linear infinite;
    }

    @keyframes borderFlow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    #webgl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
      touch-action: none;
    }

    .speed-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.3s;
      background: radial-gradient(circle, transparent 40%, rgba(255, 255, 255, 0.4) 90%),
                  repeating-conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255,255,255,0.08) 10deg 20deg);
    }

    .shake {
      animation: screenShake 0.05s infinite alternate;
    }

    @keyframes screenShake {
      0% { transform: translate(-3px, 2px) rotate(-0.5deg); }
      100% { transform: translate(3px, -2px) rotate(0.5deg); }
    }

    #warp-flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 200;
      transition: opacity 0.1s ease-out;
    }

    /* Startup Cockpit HUD */
    #startup-hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .hud-hidden {
      opacity: 0 !important;
      transform: scale(1.08) !important;
      pointer-events: none !important;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff0055, #00f0ff, #ffe600);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--success);
      letter-spacing: 1px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .hud-center {
      align-self: center;
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .cockpit-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .cockpit-subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: -14px;
    }

    .switches-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .switch-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .switch-card.active {
      border-color: var(--secondary);
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .switch-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .switch-card.active .switch-label {
      color: var(--secondary);
    }

    .switch-pill {
      width: 44px;
      height: 24px;
      background: #222;
      border-radius: 12px;
      position: relative;
    }

    .switch-card.active .switch-pill {
      background: var(--secondary);
    }

    .switch-knob {
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.2s ease;
    }

    .switch-card.active .switch-knob {
      transform: translateX(20px);
    }

    .throttle-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .throttle-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
    }

    .custom-range {
      width: 100%;
      height: 14px;
      background: rgba(0,0,0,0.5);
      border-radius: 7px;
      outline: none;
      border: 1px solid var(--border);
      accent-color: var(--primary);
    }

    .launch-btn {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000;
      background: linear-gradient(90deg, #333, #555);
      border: none;
      border-radius: 16px;
      cursor: not-allowed;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      opacity: 0.6;
    }

    .launch-btn.ready {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      color: #000;
      opacity: 1;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
      animation: pulseBtn 1s infinite alternate;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); }
      100% { transform: scale(1.02); }
    }

    /* Main Site Dashboard */
    #dashboard {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      overflow-y: auto;
      padding: 20px;
      gap: 20px;
    }

    #dashboard.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 16px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .search-bar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--secondary);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--secondary);
    }

    .game-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .game-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .play-btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, var(--primary), #ff0077);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Modal Player */
    #player-modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #player-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-header {
      padding: 14px 20px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .modal-iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    .close-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--secondary);
      color: #000;
      font-weight: 800;
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 1000;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="rainbow-border-frame"></div>
  <div class="rainbow-bg"></div>
  <canvas id="webgl-canvas"></canvas>
  <div class="speed-lines" id="speed-lines"></div>
  <div id="warp-flash"></div>

  <!-- Cockpit HUD -->
  <div id="startup-hud">
    <div class="hud-header">
      <span class="brand-title">STATIC-9A3</span>
      <div class="status-badge">
        <div class="pulse-dot"></div>
        SYSTEM READY
      </div>
    </div>

    <div class="hud-center">
      <div>
        <h1 class="cockpit-title">Rainbow Hyper-Drive</h1>
        <p class="cockpit-subtitle">Full Unblocked Game Portal</p>
      </div>

      <div class="switches-grid">
        <div class="switch-card" id="sw-core" onclick="toggleSwitch('core')">
          <span class="switch-label">1. POWER CORE</span>
          <div class="switch-pill"><div class="switch-knob"></div></div>
        </div>
        <div class="switch-card" id="sw-thruster" onclick="toggleSwitch('thruster')">
          <span class="switch-label">2. THRUSTERS</span>
          <div class="switch-pill"><div class="switch-knob"></div></div>
        </div>
      </div>

      <div class="throttle-container">
        <div class="throttle-header">
          <span>THROTTLE SPEED</span>
          <span id="throttle-txt" style="color:var(--accent);">0%</span>
        </div>
        <input type="range" class="custom-range" min="0" max="100" value="0" oninput="updateThrottle(this.value)">
      </div>

      <button class="launch-btn" id="launch-btn" onclick="triggerWarp()">ENGAGE WARP</button>
    </div>

    <div style="font-size: 10px; color: var(--text-dim); text-align: center;">
      static-9a3.pages.dev &bull; Edge CDN Active
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="dash-header">
      <div>
        <h2 style="font-size:18px;">STATIC-9A3 HUB</h2>
        <p style="font-size:11px; color:var(--text-dim);">Unblocked HTML Games & Tools</p>
      </div>
      <button class="play-btn" style="width:auto; padding:10px 16px;" onclick="reLaunch()">Re-Launch Warp</button>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="search-input" placeholder="Search games (e.g. Basket, Drift, Roulette)..." onkeyup="filterGames()">
    </div>

    <div class="games-grid" id="games-grid"></div>
  </div>

  <!-- Game Modal -->
  <div id="player-modal">
    <div class="modal-header">
      <span id="modal-title" style="font-weight: 800; color: var(--secondary);">Game Title</span>
      <button class="close-btn" onclick="closeModal()">CLOSE</button>
    </div>
    <iframe id="modal-iframe" class="modal-iframe" src=""></iframe>
  </div>

  <div class="toast" id="toast">Message</div>

  <script>
    const games = [
      { name: "Basket Bros", file: "Basket Bros.html", tag: "Sports" },
      { name: "Basket Battle", file: "Basket Battle.html", tag: "Sports" },
      { name: "Basketball Stars", file: "Basketball Stars.html", tag: "Sports" },
      { name: "Buckshot Roulette", file: "Buckshot Roulette.html", tag: "Action" },
      { name: "Bowmasters", file: "Bowmasters.html", tag: "Action" },
      { name: "Drift Hunters", file: "Drift Hunters.html", tag: "Racing" },
      { name: "Bridge Race", file: "Bridge Race.html", tag: "Arcade" },
      { name: "Bad Parenting 1", file: "Bad Parenting 1.html", tag: "Horror" },
      { name: "Five Nights at Epstein's", file: "Five Nights at Epstein's.html", tag: "Horror" },
      { name: "Schoolboy Runaway", file: "Schoolboy Runaway.html", tag: "Action" },
      { name: "Chat Bot AI (A.I GPT)", file: "Chat Bot AI (A.I GPT).html", tag: "Tools" },
      { name: "Soundboard", file: "Soundboard.html", tag: "Tools" }
    ];

    const state = { core: false, thruster: false, throttle: 0, ready: false };

    function renderGames(list) {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = '';
      list.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div>
            <div class="game-tag">${g.tag}</div>
            <div class="game-title">${g.name}</div>
          </div>
          <button class="play-btn" onclick="playGame('${g.file}', '${g.name}')">PLAY NOW</button>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = games.filter(g => g.name.toLowerCase().includes(q) || g.tag.toLowerCase().includes(q));
      renderGames(filtered);
    }

    function playGame(file, title) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-iframe').src = file;
      document.getElementById('player-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('player-modal').classList.remove('active');
      document.getElementById('modal-iframe').src = '';
    }

    function toggleSwitch(key) {
      state[key] = !state[key];
      const el = document.getElementById(`sw-${key}`);
      el.classList.toggle('active', state[key]);
      checkReadyState();
    }

    function updateThrottle(val) {
      state.throttle = parseInt(val);
      document.getElementById('throttle-txt').innerText = `${val}%`;
      checkReadyState();
    }

    function checkReadyState() {
      const btn = document.getElementById('launch-btn');
      if (state.core && state.thruster && state.throttle >= 80) {
        state.ready = true;
        btn.classList.add('ready');
        btn.innerText = 'BLAST OFF!';
      } else {
        state.ready = false;
        btn.classList.remove('ready');
        btn.innerText = 'ENGAGE WARP';
      }
    }

    // 3D Tube Engine
    let scene, camera, renderer, tunnelMesh;
    let speed = 0.005;

    function init3D() {
      const canvas = document.getElementById('webgl-canvas');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030308, 0.03);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const points = [];
      for (let i = 0; i < 60; i++) {
        points.push(new THREE.Vector3(Math.sin(i * 0.15) * 3, Math.cos(i * 0.1) * 3, -i * 8));
      }
      const path = new THREE.CatmullRomCurve3(points);

      const texCanvas = document.createElement('canvas');
      texCanvas.width = 512; texCanvas.height = 512;
      const ctx = texCanvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0, '#ff0055');
      grad.addColorStop(0.2, '#ffaa00');
      grad.addColorStop(0.4, '#00ff66');
      grad.addColorStop(0.6, '#00f0ff');
      grad.addColorStop(0.8, '#7000ff');
      grad.addColorStop(1, '#ff0055');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(texCanvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 40);

      const geometry = new THREE.TubeGeometry(path, 100, 3, 16, false);
      const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });

      tunnelMesh = new THREE.Mesh(geometry, material);
      scene.add(tunnelMesh);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (tunnelMesh) tunnelMesh.material.map.offset.y -= speed;
      renderer.render(scene, camera);
    }

    function triggerWarp() {
      if (!state.ready) {
        alert('Turn ON switches & slide Throttle to 80%+');
        return;
      }
      document.getElementById('startup-hud').classList.add('hud-hidden');
      document.getElementById('speed-lines').style.opacity = '1';
      document.body.classList.add('shake');

      let duration = 0;
      const warpInterval = setInterval(() => {
        speed += 0.005;
        camera.fov += 0.8;
        camera.updateProjectionMatrix();
        duration += 50;

        if (duration > 2000) {
          clearInterval(warpInterval);
          document.getElementById('warp-flash').style.opacity = '1';
          setTimeout(() => {
            document.body.classList.remove('shake');
            document.getElementById('speed-lines').style.opacity = '0';
            document.getElementById('dashboard').classList.add('visible');
            document.getElementById('warp-flash').style.opacity = '0';
          }, 300);
        }
      }, 50);
    }

    function reLaunch() {
      document.getElementById('dashboard').classList.remove('visible');
      document.getElementById('startup-hud').classList.remove('hud-hidden');
      speed = 0.005;
      camera.fov = 75;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderGames(games);
      init3D();
    });
  </script>
</body>
</html>
